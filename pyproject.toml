[project]
name = "regional-pollution-marl"
version = "0.1.0"
description = "Synthetic four-region pollution coordination with tabular Q-learning, DQN, and PPO"
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.4.0",
    "torch>=2.15.0",
]

[project.optional-dependencies]
notebooks = ["jupyterlab", "pandas", "matplotlib"]
rl = ["torch>=2.6"]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
